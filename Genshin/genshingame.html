<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guess Who: Genshin Impact</title>

  <!-- Font Genshin Impact -->
  <style>
    @font-face {
    font-family: 'Genshin';
    src: url('Genshin.ttf') format('truetype');
    }
  </style>

  <style>
    body {
      font-family: 'Genshin';
      background:url('https://4kwallpapers.com/images/walls/thumbs_3t/19465.jpg') center/cover no-repeat;
      background-attachment: scroll;
      margin: 0;
      text-align: center;
      color: #000;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255,255,255,0.4);
      backdrop-filter: blur(8px);
      z-index: -1;
    }


    h1 {
      padding: 20px;
      margin: 0;
      background: rgba(255, 140, 0, 8);
      color: #000;
      font-size: 28px;
      letter-spacing: 1px;
    }

    .info-container {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      margin: 20px auto;
      background: rgba(255, 255, 255, 0.75);
      border-radius: 15px;
      box-shadow: 0 2px 15px rgba(0,0,0,0.3);
      width: 80%;
      max-width: 900px;
      padding: 20px 30px;
      backdrop-filter: blur(10px);
      flex-wrap: wrap;
    }

    .info-img {
      flex: 1;
      text-align: center;
      margin: 15px;
    }

    .info-img img {
      width: 180px;
      height: 180px;
      border-radius: 10px;
      object-fit: cover;
      box-shadow: 0 3px 10px rgba(0,0,0,0.4);
    }

    .info-content {
      flex: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .info-content h3 {
      text-align: center;
      font-size: 22px;
      margin-bottom: 15px;
      margin-top: 0;
    }

    .info-detail {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      text-align: left;
      width: 100%;
      max-width: 550px;
    }

    .info-left, .info-right {
      flex: 1;
    }

    .info-left p, .info-right p {
      font-size: 17px;
      margin: 6px 0;
      color: #000;
    }
    .info-left p:first-child {
      font-size: 18px;
    }

    .filters {
      margin: 10px auto;
    }

    select {
      margin: 5px;
      padding: 8px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(10px);
      font-weight: bold;
      cursor: pointer;
    }

    label {
      background: rgb(255, 255, 255);
      padding: 1.5px;
      border-radius: 3px;
    }

    button {
      background: rgba(255, 255, 255, 0.85);
      color: #000;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
      margin-bottom: 7px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      backdrop-filter: blur(6px);
    }

    button:hover {
      background: rgba(255, 180, 50, 1);
    }

    /* Papan karakter full width */
    .board {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      padding: 20px;
      /* max-width: 1000px; */
      margin: 0 auto;
      justify-content: center;
      justify-items: center;
      align-items: start;
    }

    .card {
      background: rgba(255, 255, 255, 0.85);
      border-radius: 12px;
      padding: 10px;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      transition: transform 0.2s, box-shadow 0.2s;
      backdrop-filter: blur(6px);
      text-align: center;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    }

    .card img {
      width: 100%;
      height: 130px;
      object-fit: contain;
      border-radius: 8px;
    }

    .card:hover {
      transform: scale(1.05);
      background: rgba(255, 165, 0, 0.3);
    }

    .eliminated {
      opacity: 0.3;
      filter: grayscale(100%);
      text-decoration: line-through;
    }

    #count {
      font-weight: bold;
      font-size: 18px;
      margin: 10px auto 0;
      background: rgb(255, 255, 255);
      padding: 1.5px;
      border-radius: 5px;
      max-width: 190px;
      text-align: center;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 20px;
      }

      .info-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 0;
        margin: 15px auto;
      }

      .info-container h3 {
        text-align: center;
        font-size: 22px;
        margin-bottom: -6px;
      }

      .info-detail {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        text-align: left;
        width: 95%;
        max-width: 340px;
        margin: 8px;
      }

      .info-detail p {
        margin: 4px 0;
        font-size: 16px;
        line-height: 1.4;
      }

      .board {
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        gap: 10px;
        padding: 10px;
        justify-content: center;
        justify-items: center;
      }

      .card img {
        width: 100%;
        height: auto;
        object-fit: contain;
      }

      .card {
        padding: 6px;
      }
    }

  </style>
</head>

  <div class="info-content">
    <h3>Karakter Kamu</h3>

    ];

    let eliminatedSet = new Set();
    const board = document.getElementById('board');

    function renderBoard(filteredChars = characters) {
      board.innerHTML = '';
      filteredChars.forEach(c => {
        const card = document.createElement('div');
        card.className = 'card';
        if (eliminatedSet.has(c.name)) card.classList.add('eliminated');

        card.innerHTML = `
          <img src="${c.img}" alt="${c.name}">
          <p>${c.name}</p>
        `;

        card.onclick = () => toggleElimination(c.name, card);
        board.appendChild(card);
      });
      document.getElementById('count').textContent = 
        `Sisa karakter: ${characters.length - eliminatedSet.size}`;
    }

    function toggleElimination(name, card) {
      if (eliminatedSet.has(name)) {
        eliminatedSet.delete(name);
        card.classList.remove('eliminated');
      } else {
        eliminatedSet.add(name);
        card.classList.add('eliminated');
      }
      document.getElementById('count').textContent = 
        `Sisa karakter: ${characters.length - eliminatedSet.size}`;
    }

    function applyFilter() {
      const vision = document.getElementById('visionFilter').value;
      const region = document.getElementById('regionFilter').value;
      const weapon = document.getElementById('weaponFilter').value;
      const role = document.getElementById('roleFilter').value;

      const versions = Array.from(document.querySelectorAll('.verFilter:checked')).map(cb => cb.value);

      let filtered = characters.filter(c => {
        return (!vision || c.vision === vision) &&
              (!region || c.region === region) &&
              (!weapon || c.weapon === weapon) &&
              (!role || c.role === role) &&
              (versions.length === 0 || versions.includes(c.releaseVersion));
      });

      // tampilkan hanya karakter sesuai filter, tetapi tetap simpan eliminasi
      renderBoard(filtered);
    }

    function generateCharacter() {
      // reset semua eliminasi
      eliminatedSet.clear();

      // reset filter
      document.getElementById('visionFilter').value = '';
      document.getElementById('regionFilter').value = '';
      document.getElementById('weaponFilter').value = '';
      document.getElementById('roleFilter').value = '';
      document.querySelectorAll('.verFilter').forEach(cb => cb.checked = false);

      // pilih karakter random
      const randomChar = characters[Math.floor(Math.random() * characters.length)];

      document.getElementById('charImg').src = randomChar.img;
      document.getElementById('charName').textContent = randomChar.name;
      document.getElementById('charVision').textContent = randomChar.vision;
      document.getElementById('charWeapon').textContent = randomChar.weapon;
      document.getElementById('charRegion').textContent = randomChar.region;
      document.getElementById('charModel').textContent = randomChar.modelType;
      document.getElementById('charRelease').textContent = randomChar.releaseVersion;
      document.getElementById('charRole').textContent = randomChar.role;

      // render ulang papan penuh
      renderBoard();
    }

    // jalankan awal
    generateCharacter();
