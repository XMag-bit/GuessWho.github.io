<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guess Who: Honkai Star Rail</title>

  <!-- Font Honkai Star Rail -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap');
  </style>

  <style>
    body {
      font-family: 'Orbitron', sans-serif;
      background: url('https://images7.alphacoders.com/132/1324267.png') center/cover no-repeat;
      background-attachment: fixed;
      margin: 0;
      text-align: center;
      color: #e0e0ff;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(10, 15, 30, 0.65);
      backdrop-filter: blur(10px);
      z-index: -1;
    }

    h1 {
      padding: 20px;
      margin: 0;
      background: linear-gradient(90deg, #2b2e77, #5060e0, #29aaff);
      color: #ffffff;
      font-size: 30px;
      letter-spacing: 2px;
      text-shadow: 0 0 8px #29aaff;
      border-bottom: 2px solid rgba(255,255,255,0.2);
    }

    .info-container {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      margin: 25px auto;
      background: rgba(30, 40, 70, 0.6);
      border: 1px solid rgba(100, 150, 255, 0.3);
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0, 150, 255, 0.25);
      width: 85%;
      max-width: 950px;
      padding: 25px;
      flex-wrap: wrap;
      backdrop-filter: blur(12px);
    }

    .info-img {
      flex: 1;
      text-align: center;
      margin: 15px;
    }

    .info-img img {
      width: 180px;
      height: 180px;
      border-radius: 15px;
      object-fit: cover;
      box-shadow: 0 0 20px rgba(100, 150, 255, 0.4);
    }

    .info-content {
      flex: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .info-content h3 {
      text-align: center;
      font-size: 22px;
      color: #a2cfff;
      margin-bottom: 15px;
      margin-top: 0;
      text-shadow: 0 0 5px #1e90ff;
    }

    .info-detail {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      text-align: left;
      width: 100%;
      max-width: 550px;
    }

    .info-left p, .info-right p {
      font-size: 16px;
      margin: 6px 0;
      color: #cfdcff;
    }

    .filters {
      margin: 15px auto;
    }

    select {
      margin: 5px;
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(25, 35, 60, 0.7);
      color: #a2cfff;
      border: 1px solid rgba(100,150,255,0.4);
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    select:hover {
      background: rgba(40, 80, 140, 0.8);
    }

    label {
      background: rgba(40, 60, 100, 0.5);
      padding: 3px 6px;
      border-radius: 4px;
      color: #cfe4ff;
      margin: 2px;
    }

    button {
      background: linear-gradient(90deg, #2633a8, #3e59ff);
      color: #fff;
      border: none;
      padding: 10px 25px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      letter-spacing: 1px;
      transition: 0.3s;
      margin: 10px;
      box-shadow: 0 0 10px rgba(90, 130, 255, 0.4);
    }

    button:hover {
      background: linear-gradient(90deg, #29aaff, #7aa6ff);
      box-shadow: 0 0 15px rgba(80, 180, 255, 0.7);
      transform: translateY(-2px);
    }

    /* Papan karakter */
    .board {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 20px;
      padding: 20px;
      max-width: 1500px;
      margin: 0 auto;
      justify-content: center;
      justify-items: center;
      align-items: start;
    }

    .card {
      background: rgba(25, 35, 60, 0.8);
      border: 1px solid rgba(80,120,255,0.4);
      border-radius: 15px;
      padding: 10px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(100,150,255,0.3);
      transition: transform 0.3s, box-shadow 0.3s;
      color: #dbe9ff;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 200px;
      min-width: 140px;
    }

    .card-name {
      margin-top: auto;
      text-align: center;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.2;
      margin-bottom: 5px;
    }


    .card p {
      margin-top: auto;
      text-align: center;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.2;
      margin-bottom: 5px; /* opsional: sedikit jarak bawah agar teks tak menempel tepi */
    }


    .card:hover {
      transform: scale(1.07);
      background: rgba(40, 80, 150, 0.8);
      box-shadow: 0 0 20px rgba(100,180,255,0.5);
    }

    .card img {
      width: 100%;
      height: 130px;
      object-fit: cover; /* agar gambar tetap proporsional */
      border-radius: 10px;
    }

    .eliminated {
      opacity: 0.25;
      filter: grayscale(100%);
      text-decoration: line-through;
    }

    #count {
      font-weight: bold;
      font-size: 17px;
      margin: 10px auto;
      background: rgba(25,35,60,0.8);
      padding: 6px 15px;
      border-radius: 10px;
      border: 1px solid rgba(100,150,255,0.4);
      color: #cfe4ff;
      max-width: 200px;
    }

   @media (max-width: 600px) {
      h1 {
        font-size: 20px;
      }

      .info-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 0;
        margin: 15px auto;
      }

      .info-container h3 {
        text-align: center;
        font-size: 22px;
        margin-bottom: -6px;
      }

      .info-detail {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        text-align: left;
        width: 95%;
        max-width: 340px;
        margin: 8px;
      }

      .info-detail p {
        margin: 4px 0;
        font-size: 16px;
        line-height: 1.4;
      }

      /* 🧩 Ukuran papan karakter untuk HP */
      .board {
        grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); /* lebih kecil */
        gap: 8px;
        padding: 8px;
        justify-content: center;
        justify-items: center;
      }

      /* 🧱 Card seragam dan rapi */
      .card {
        background: rgba(25, 35, 60, 0.8);
        border: 1px solid rgba(80,120,255,0.4);
        border-radius: 10px;
        padding: 6px;
        height: 140px; /* semua card sama tinggi */
        min-width: 85px; /* seragam */
        max-width: 100px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        color: #dbe9ff;
        font-size: 12px;
        text-align: center;
      }

      /* 🖼️ Gambar lebih kecil dan tidak menempel dengan teks */
      .card img {
        width: 100%;
        height: 90px;
        object-fit: contain;
        border-radius: 6px;
        margin-bottom: 5px; /* jarak dengan teks */
      }

      /* 📝 Teks tetap di tengah dan tidak menempel gambar */
      .card p {
        font-size: 12px;
        margin: 0;
        line-height: 1.3;
      }
    }

  </style>
</head>

      // Elemen DOM
        const board = document.getElementById("board");
        const countDisplay = document.getElementById("count");

        // Fungsi untuk menampilkan semua karakter ke papan
        function displayCharacters(list) {
          board.innerHTML = "";
          list.forEach(char => {
            const card = document.createElement("div");
            card.classList.add("card");
            card.innerHTML = `
              <img src="${char.image}" alt="${char.name}">
              <p class="card-name">${char.name}</p>
            `;

            // Tambahkan event klik untuk eliminasi
            card.addEventListener("click", () => {
              card.classList.toggle("eliminated");
              updateCount();
            });

            board.appendChild(card);
          });

          updateCount();
        }

        // Hitung sisa karakter yang belum dieliminasi
        function updateCount() {
          const total = document.querySelectorAll(".card").length;
          const eliminated = document.querySelectorAll(".card.eliminated").length;
          countDisplay.textContent = `Tersisa: ${total - eliminated} / ${total}`;
        }

        // Fitur filter
        function applyFilter() {
          const path = document.getElementById("pathFilter").value;
          const element = document.getElementById("elementFilter").value;
          const faction = document.getElementById("factionFilter").value;
          const versions = Array.from(document.querySelectorAll(".verFilter:checked")).map(v => v.value);

          const filtered = characters.filter(c =>
            (path === "" || c.path === path) &&
            (element === "" || c.element === element) &&
            (faction === "" || c.faction === faction) &&
            (versions.length === 0 || versions.includes(c.version))
          );

          displayCharacters(filtered);
        }

        // Pilih karakter acak untuk pemain
        function generateCharacter() {
          const random = characters[Math.floor(Math.random() * characters.length)];
          document.getElementById("charImg").src = random.image;
          document.getElementById("charName").textContent = random.name;
          document.getElementById("charElement").textContent = random.element;
          document.getElementById("charPath").textContent = random.path;
          document.getElementById("charFaction").textContent = random.faction;
          document.getElementById("charRelease").textContent = random.version;

          displayCharacters(characters);
        }

        // Jalankan awal
        generateCharacter();
    </script>
  </body>
</html>
