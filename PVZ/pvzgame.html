<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guess Who: Plants vs Zombies</title>
  <style>
    @font-face {
      font-family: 'PVZ';
      src: url('PVZ.ttf');
    }

    body {
      font-family: 'PVZ', sans-serif;
      background: url('Background/Almanac_GroundDay.jpg') repeat;
      background-attachment: fixed;
      margin: 0;
      text-align: center;
      color: #fff;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(6px);
      z-index: -1;
    }

    h1 {
      background: url('Background/Almanac_GroundRoof.jpg');
      color: #f5f5dc;
      padding: 20px;
      font-size: 32px;
      text-shadow: 2px 2px 5px #2e7d32;
      margin: 0;
      border-bottom: 3px solid rgba(255,255,255,0.3);
      letter-spacing: 2px;
    }

    .filter-container {
      margin-top: 15px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    select {
      background: rgba(80,150,80,0.8);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 10px;
      color: white;
      padding: 8px 12px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255,255,255,0.2);
      transition: 0.3s;
    }

    select:hover {
      background: rgba(100,180,100,0.9);
    }

    .info-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 25px auto;
      background: rgba(60, 120, 60, 0.7);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0, 100, 0, 0.5);
      width: 85%;
      max-width: 900px;
      padding: 25px;
      flex-wrap: wrap;
    }

    .info-img img {
      width: 150px;
      height: 150px;
      border-radius: 10px;
      object-fit: cover;
      box-shadow: 0 0 10px rgba(255,255,255,0.3);
    }

    .info-content {
      flex: 2;
      text-align: left;
      margin-left: 24px;
    }

    .info-content h3 {
      text-align: center;
      font-size: 22px;
      color: #e8f5e9;
      margin-top: 2px;
      margin-bottom: 2px ;
    }

    .info-detail p {
      font-size: 17px;
      margin: 5px 0;
      color: #e0f2f1;
    }

    button {
      background: linear-gradient(90deg, #22b127, #4d734f);      
      color: white;
      border: none;
      padding: 10px 25px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
      margin-top: 20px;
      box-shadow: 0 0 10px rgba(50, 200, 50, 0.4);
    }

    button:hover {
      background: linear-gradient(90deg, #66bb6a, #a5d6a7);
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(100,255,100,0.5);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 140px));
      justify-content: center;
      gap: 20px;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: rgba(50,100,50,0.8);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 15px;
      padding: 10px;
      color: #fff;
      text-align: center;
      transition: 0.3s;
      cursor: pointer;
    }

    .card img {
      width: 100%;
      height: 120px;
      border-radius: 10px;
      object-fit: cover;
    }

    .card:hover {
      transform: scale(1.05);
      background: rgba(80,150,80,0.8);
    }

    .eliminated {
      opacity: 0.25;
      filter: grayscale(100%);
      text-decoration: line-through;
    }

    #count {
      background: rgba(0, 100, 0, 0.6);
      border-radius: 10px;
      display: inline-block;
      padding: 8px 15px;
      margin: 10px;
      font-weight: bold;
      color: #e0f2f1;
    }

    @media (max-width: 600px) {
        h1 {
            font-size: 22px;
            padding: 15px;
        }

        .board {
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 16px;
            padding: 15px;
        }

        .info-container {
          display: flex;
          justify-content: center;
          align-items: center;
          margin: 25px auto;
          background: rgba(60, 120, 60, 0.7);
          border: 2px solid rgba(255,255,255,0.3);
          border-radius: 20px;
          box-shadow: 0 0 20px rgba(0, 100, 0, 0.5);
          width: 85%;
          max-width: 900px;
          padding: 25px;
          flex-wrap: wrap;
        }

        .info-img img {
          width: 150px;
          height: 150px;
          border-radius: 10px;
          object-fit: cover;
          box-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .info-content {
          flex: 2;
          text-align: left;
          margin-left: 20px;
        }

        .info-content h3 {
          text-align: center;
          font-size: 22px;
          color: #e8f5e9;
          margin-bottom: 10px;
        }

        .info-detail p {
          font-size: 16px;
          margin: 5px 0;
          color: #e0f2f1;
        }

        .card img {
            height: 100px;
        }

        .card p {
            font-size: 16px;
        }

        .board {
            padding-left: 10px;
            padding-right: 10px;
        }
    }
  </style>
</head>

<body>

  <div class="info-container">
    <div class="info-img">
      <img id="charImg" src="" alt="Karakter">
    </div>
    <div class="info-content">
      <h3>Karakter Kamu</h3>
      <div class="info-detail">

        <p>Jenis: <span id="charType"></span></p>
        <p>Worlds: <span id="charWorld"></span></p>
        <p>Size: <span id="charSize"></span></p>
        <p>Speed: <span id="charSpeed"></span></p>
      </div>
    </div>
  </div>
  
  <!-- 🌿 Filter -->
  <div class="filter-container">
    <select id="typeFilter" onchange="applyFilter()">
      <option value="">Semua Jenis</option>
      <option value="Plant">Plant</option>
      <option value="Zombie">Zombie</option>
    </select>
    
    <select id="worldFilter" onchange="applyFilter()">
      <option value="">Semua Dunia</option>
      <option value="Lawn">Lawn</option>
      <option value="Night">Night</option>
      <option value="Pool">Pool</option>
      <option value="Fog">Fog</option>
      <option value="Roof">Roof</option>
      <option value="All Worlds">All Worlds</option>
    </select>

    <select id="sizeFilter" onchange="applyFilter()">
      <option value="">Semua Size</option>
      <option value="Small">Small</option>
      <option value="Medium">Medium</option>
      <option value="Large">Large</option>
      <option value="Huge">Huge</option>
    </select>

    <select id="speedFilter" onchange="applyFilter()">
      <option value="">Semua Speed</option>
      <option value="Instant">Instant</option>
      <option value="Passive">Passive</option>
      <option value="Slow">Slow</option>
      <option value="Normal">Normal</option>
      <option value="Fast">Fast</option>
      <option value="Very Fast">Very Fast</option>
      <option value="Very Slow">Very Slow</option>
    </select>
  </div>
    
  <div>
    <button onclick="generateCharacter()">Mulai Ulang (RNG)</button>
  </div>
  
  <div id="count"></div>
  <div class="board" id="board"></div>

    // 🌱 Tampilkan karakter
    function displayCharacters(list) {
      const board = document.getElementById("board");
      board.innerHTML = "";
      list.forEach(char => {
        const card = document.createElement("div");
        card.classList.add("card");
        card.innerHTML = `<img src="${char.image}" alt="${char.name}"><p>${char.name}</p>`;
        card.addEventListener("click", () => {
          card.classList.toggle("eliminated");
          updateCount();
        });
        board.appendChild(card);
      });
      updateCount();
    }

    // 🧮 Update jumlah karakter tersisa
    function updateCount() {
      const total = document.querySelectorAll(".card").length;
      const eliminated = document.querySelectorAll(".card.eliminated").length;
      document.getElementById("count").textContent = `Tersisa: ${total - eliminated} / ${total}`;
    }

    // 🧩 Filter berdasarkan semua kategori
    function applyFilter() {
      const typeValue = document.getElementById("typeFilter").value;
      const worldValue = document.getElementById("worldFilter").value;
      const sizeValue = document.getElementById("sizeFilter").value;
      const speedValue = document.getElementById("speedFilter").value;
      const cards = document.querySelectorAll(".card");

      cards.forEach(card => {
        const char = characters.find(c => c.name === card.querySelector("p").textContent);
        const matchType = !typeValue || char.type === typeValue;
        const matchWorld = !worldValue || char.world === worldValue;
        const matchSize = !sizeValue || char.size === sizeValue;
        const matchSpeed = !speedValue || char.speed === speedValue;
        card.style.display = (matchType && matchWorld && matchSize && matchSpeed) ? "block" : "none";
      });

      updateCount();
    }

    // 🎲 RNG
    function generateCharacter() {
      const random = characters[Math.floor(Math.random() * characters.length)];
      document.getElementById("charImg").src = random.image;
      document.getElementById("charName").textContent = random.name;
      document.getElementById("charType").textContent = random.type;
      document.getElementById("charWorld").textContent = random.world;
      document.getElementById("charSize").textContent = random.size;
      document.getElementById("charSpeed").textContent = random.speed;
      displayCharacters(characters);
    }

    displayCharacters(characters);
    generateCharacter();
  </script>

</html>
