<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guess Who: Plants vs Zombies</title>

  <style>
    @font-face {
      font-family: 'PVZ';
      src: url('PVZ.ttf');
    }

    body {
      font-family: 'PVZ', sans-serif;
      background: url('Background/Almanac_GroundDay.jpg') repeat;
      background-attachment: fixed;
      margin: 0;
      text-align: center;
      color: #fff;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(6px);
      z-index: -1;
    }

    h1 {
      background: url('Background/Almanac_GroundRoof.jpg');
      color: #f5f5dc;
      padding: 20px;
      font-size: 32px;
      text-shadow: 2px 2px 5px #2e7d32;
      margin: 0;
      border-bottom: 3px solid rgba(255,255,255,0.3);
      letter-spacing: 2px;
    }

    .filter-container {
      margin-top: 15px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    select {
      background: rgba(80,150,80,0.8);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 10px;
      color: white;
      padding: 8px 12px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255,255,255,0.2);
      transition: 0.3s;
    }

    select:hover {
      background: rgba(100,180,100,0.9);
    }

    .info-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 25px auto;
      background: rgba(60, 120, 60, 0.7);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0, 100, 0, 0.5);
      width: 85%;
      max-width: 900px;
      padding: 25px;
      flex-wrap: wrap;
    }

    .info-img img {
      width: 150px;
      height: 150px;
      border-radius: 10px;
      object-fit: cover;
      box-shadow: 0 0 10px rgba(255,255,255,0.3);
    }

    .info-content {
      flex: 2;
      text-align: left;
      margin-left: 20px;
    }

    .info-content h3 {
      text-align: center;
      font-size: 22px;
      color: #e8f5e9;
      margin-top: 0;
    }

    .info-detail p {
      font-size: 18px;
      margin: 5px 0;
      color: #e0f2f1;
    }

    button {
      background: linear-gradient(90deg, #4caf50, #81c784);
      color: white;
      border: none;
      padding: 10px 25px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
      margin: 10px;
      box-shadow: 0 0 10px rgba(50, 200, 50, 0.4);
    }

    button:hover {
      background: linear-gradient(90deg, #66bb6a, #a5d6a7);
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(100,255,100,0.5);
    }

    .board {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 140px)); /* <- tetap ukuran fix */
    justify-content: center; /* supaya rata tengah */
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 20px;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: rgba(50,100,50,0.8);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 15px;
      padding: 10px;
      color: #fff;
      text-align: center;
      transition: 0.3s;
      cursor: pointer;
    }

    .card img {
      width: 100%;
      height: 120px;
      border-radius: 10px;
      object-fit: cover;
    }

    .card:hover {
      transform: scale(1.05);
      background: rgba(80,150,80,0.8);
    }

    .eliminated {
      opacity: 0.25;
      filter: grayscale(100%);
      text-decoration: line-through;
    }

    #count {
      background: rgba(0, 100, 0, 0.6);
      border-radius: 10px;
      display: inline-block;
      padding: 8px 15px;
      margin: 10px;
      font-weight: bold;
      color: #e0f2f1;
    }

   /* 📱 Responsive untuk HP atau layar kecil */
    @media (max-width: 600px) {
    /* --- Tambahan dari sebelumnya --- */
        .board {
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 16px;
            padding: 15px;
        }

        .card {
            transform: scale(1); /* 🔹 memperbesar card di HP */
        }

        .card img {
            height: 100px; /* 🔹 gambar lebih besar */
        }

        .card p {
            font-size: 16px; /* 🔹 teks sedikit lebih besar */
        }

        /* Pastikan card tidak terlalu mepet di sisi layar */
        .board {
            padding-left: 10px;
            padding-right: 10px;
        }
    }
  </style>
</head>

        // 🌱 Menampilkan semua karakter
        function displayCharacters(list) {
            const board = document.getElementById("board");
            board.innerHTML = "";
            list.forEach(char => {
            const card = document.createElement("div");
            card.classList.add("card");
            card.innerHTML = `
                <img src="${char.image}" alt="${char.name}">
                <p>${char.name}</p>
            `;
            card.addEventListener("click", () => {
                card.classList.toggle("eliminated");
                updateCount();
            });
            board.appendChild(card);
            });
            updateCount();
        }

        // 🧮 Update jumlah karakter tersisa
        function updateCount() {
            const total = document.querySelectorAll(".card").length;
            const eliminated = document.querySelectorAll(".card.eliminated").length;
            document.getElementById("count").textContent = `Tersisa: ${total - eliminated} / ${total}`;
        }

        // 🧩 Terapkan filter tanpa menghapus status eliminasi
        function applyFilter() {
            const typeValue = document.getElementById("typeFilter").value;
            const worldValue = document.getElementById("worldFilter").value;
            const board = document.getElementById("board");
            const cards = board.querySelectorAll(".card");

            cards.forEach(card => {
            const char = characters.find(c => c.name === card.querySelector("p").textContent);
            const matchType = typeValue === "" || char.type === typeValue;
            const matchWorld = worldValue === "" || char.world === worldValue;
            card.style.display = (matchType && matchWorld) ? "block" : "none";
            });

            updateCount();
        }

        // 🎲 Tombol “Mulai Ulang” (reset total)
        function generateCharacter() {
            // RNG karakter acak
            const random = characters[Math.floor(Math.random() * characters.length)];
            document.getElementById("charImg").src = random.image;
            document.getElementById("charName").textContent = random.name;
            document.getElementById("charType").textContent = random.type;
            document.getElementById("charWorld").textContent = random.world;
            document.getElementById("charSun").textContent = random.sun;

            // Reset semua filter & eliminasi
            document.getElementById("typeFilter").value = "";
            document.getElementById("worldFilter").value = "";
            displayCharacters(characters);
        }

        // 🚀 Jalankan pertama kali
        displayCharacters(characters);
        generateCharacter();
    </script>

</html>
