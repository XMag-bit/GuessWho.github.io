      body {
      font-family: 'Orbitron', sans-serif;
      background: url('https://images7.alphacoders.com/592/thumb-1920-592678.jpg') center/cover no-repeat;
      background-attachment: fixed;
      margin: 0;
      text-align: center;
      color: #e8ffe6;
      }

      body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 25, 10, 0.75);
      backdrop-filter: blur(10px);
      z-index: -1;
      }

      /* ======== HEADER ======== */
      h1 {
      padding: 20px;
      margin: 0;
      background: linear-gradient(90deg, #0f6d2a, #16a34a, #4ade80);
      color: #ffffff;
      font-size: 30px;
      letter-spacing: 2px;
      text-shadow: 0 0 10px #4ade80;
      border-bottom: 2px solid rgba(255,255,255,0.15);
      }

      /* ======== INFO CARD ======== */
      .info-container {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      margin: 25px auto;
      background: rgba(10, 45, 20, 0.6);
      border: 1px solid rgba(80, 255, 150, 0.3);
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(0, 255, 130, 0.25);
      width: 85%;
      max-width: 950px;
      padding: 25px;
      flex-wrap: wrap;
      backdrop-filter: blur(12px);
      }

      .info-img {
      flex: 1;
      text-align: center;
      margin: 15px;
      }

      .info-img img {
      width: 180px;
      height: 180px;
      border-radius: 15px;
      object-fit: cover;
      box-shadow: 0 0 20px rgba(80, 255, 150, 0.4);
      }

      .info-content {
      flex: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      }

      .info-content h3 {
      text-align: center;
      font-size: 22px;
      color: #6fff72;
      margin-bottom: 15px;
      margin-top: 0;
      text-shadow: 0 0 8px #4ade80;
      }

      .info-detail {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      text-align: left;
      width: 100%;
      max-width: 550px;
      }

      .info-left p, .info-right p {
      font-size: 16px;
      margin: 6px 0;
      color: #ccffd2;
      }

      /* ======== FILTERS ======== */
      .filters, .filter-container {
      margin: 15px auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      padding: 15px;
      backdrop-filter: blur(8px);
      }

      select {
      margin: 5px;
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(10, 40, 20, 0.8);
      color: #4ade80;
      border: 1px solid rgba(34,197,94,0.4);
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      }

      select:hover {
      background: rgba(20, 80, 40, 0.9);
      box-shadow: 0 0 10px rgba(74,222,128,0.2);
      }

      label {
      background: rgba(20, 60, 30, 0.5);
      padding: 3px 6px;
      border-radius: 4px;
      color: #ccffd2;
      margin: 2px;
      }

      /* ======== BUTTON ======== */
      button {
      background: linear-gradient(90deg, #16a34a, #22c55e, #4ade80);
      color: #1b1b1b;
      border: none;
      padding: 10px 25px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      letter-spacing: 1px;
      transition: 0.3s;
      margin: 10px;
      box-shadow: 0 0 15px rgba(34,197,94,0.5);
      }

      button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(74,222,128,0.8);
      }

      /* ======== BOARD ======== */
      .board {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 20px;
      padding: 20px;
      max-width: 1500px;
      margin: 0 auto;
      justify-content: center;
      justify-items: center;
      align-items: start;
      }

      .card {
      background: rgba(10, 40, 20, 0.85);
      border: 1px solid rgba(74,222,128,0.3);
      border-radius: 15px;
      padding: 10px;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(34,197,94,0.25);
      transition: transform 0.3s, box-shadow 0.3s;
      color: #e8ffe6;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 200px;
      min-width: 140px;
      }

      .card:hover {
      transform: scale(1.07);
      background: rgba(20, 90, 40, 0.9);
      box-shadow: 0 0 20px rgba(34,197,94,0.5);
      }

      .card img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      }

      .card-name {
      margin-top: auto;
      font-weight: bold;
      color: #6fff72;
      text-shadow: 0 0 6px rgba(74,222,128,0.6);
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.2;
      margin-bottom: 5px;
      }
      
      .card-type {
      font-size:13px;
      color:#aaffaa;
      margin-top:-3px;
      }

      /* ======== CARD STATE ======== */
      .eliminated {
      opacity: 0.25;
      filter: grayscale(100%);
      text-decoration: line-through;
      }

      /* ======== COUNTER ======== */
      #count {
      font-weight: bold;
      font-size: 17px;
      margin: 10px auto;
      background: rgba(10,30,20,0.8);
      padding: 6px 15px;
      border-radius: 10px;
      border: 1px solid rgba(74,222,128,0.3);
      color: #4ade80;
      box-shadow: 0 0 10px rgba(74,222,128,0.3);
      max-width: 200px;
      }



      @media (max-width: 600px) {
        h1 {
          font-size: 20px;
        }

        .info-container {
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          padding: 0;
          margin: 15px auto;
        }

        .info-container h3 {
          text-align: center;
          font-size: 22px;
          margin-bottom: -6px;
        }

        .info-detail {
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          text-align: left;
          width: 95%;
          max-width: 340px;
          margin: 8px;
        }

        .info-detail p {
          margin: 4px 0;
          font-size: 16px;
          line-height: 1.4;
        }

        .board {
          grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
          gap: 8px;
          padding: 8px;
          justify-content: center;
          justify-items: center;
        }

        .card {
          padding: 6px;
          height: 140px;
          min-width: 85px;
          max-width: 100px;
          font-size: 12px;
        }

        .card-name {
          margin-top: auto;
          font-weight: bold;
          color: #6fff72;
          text-shadow: 0 0 6px rgba(74,222,128,0.6);
          min-height: 20px;
          display: flex;
          align-items: center;
          justify-content: center;
          line-height: 1.2;
          margin-bottom: 5px;
        }

        .card img {
          width: 100%;
          height: 90px;
          object-fit: contain;
          border-radius: 6px;
          margin-bottom: 5px;
        }

        .card-type {
        font-size: 10px;
        opacity: 0.85;
        }

        .card p {
          font-size: 12px;
          margin: 0;
          line-height: 1.3;
        } */
      }
    </style>

    </div>

    <button onclick="generatePokemon()">Mulai Ulang (RNG)</button>

        {id: 898, name: "Calyrex", type: "Psychic/Grass", eggGroup: ["Unknown"], category: "Legendary", evoMethod: "Cannot Evolve", generation: 8, region: "Galar", eliminated: false},
      ]

      characters.forEach(p => {
        p.image = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${p.id}.png`;
      });

      const board = document.getElementById("board");
      const countDisplay = document.getElementById("count");

      function displayCharacters(list) {
        board.innerHTML = "";
        list.forEach(char => {
          const typeArray = char.type.split("/"); // 🔥 ubah ke array saat ditampilkan
          const card = document.createElement("div");
          card.classList.add("card");
          if (char.eliminated) card.classList.add("eliminated");
          card.innerHTML = `
            <img src="${char.image}" alt="${char.name}">
            <p class="card-name">${char.name}</p>
            <p class="card-type">${char.type}</p>
          `;
          card.addEventListener("click", () => {
            char.eliminated = !char.eliminated;
            card.classList.toggle("eliminated");
            updateCount();
          });
          board.appendChild(card);
        });
        updateCount();
      }

      function updateCount() {
        const total = characters.length;
        const eliminated = characters.filter(c => c.eliminated).length;
        countDisplay.textContent = `Tersisa: ${total - eliminated} / ${total}`;
      }

      function applyFilter() {
        const genValue = document.getElementById("genFilter").value;
        const regionValue = document.getElementById("regionFilter").value;
        const typeValue = document.getElementById("typeFilter").value;
        const categoryValue = document.getElementById("categoryFilter").value;
        const eggValue = document.getElementById("eggGroupFilter").value;
        const evoValue = document.getElementById("evolutionFilter").value;
        const multiTypeChecked = document.querySelector(".multiTypeFilter").checked;

        const filtered = characters.filter(c => {
          const typeArray = c.type.split("/"); // 🔥 agar bisa pakai .includes()
          const matchesGen = !genValue || Number(genValue) === c.generation;
          const matchesRegion = !regionValue || c.region === regionValue;
          const matchesType = !typeValue || typeArray.includes(typeValue);
          const matchesCategory = !categoryValue || c.category === categoryValue;
          const matchesEgg = !eggValue || c.eggGroup.includes(eggValue);
          const matchesEvo = !evoValue || c.evoMethod.toLowerCase().includes(evoValue.toLowerCase());
          const matchesMulti = !multiTypeChecked || typeArray.length > 1;

          return (
            matchesGen &&
            matchesRegion &&
            matchesType &&
            matchesCategory &&
            matchesEgg &&
            matchesEvo &&
            matchesMulti
          );
        });

        displayCharacters(filtered);
      }

      function generatePokemon() {
        // 🆕 Reset semua Pokémon agar tidak tereliminasi lagi
        characters.forEach(p => p.eliminated = false);

        const random = characters[Math.floor(Math.random() * characters.length)];
        const typeArray = random.type.split("/"); // 🔥 ubah ke array untuk tampilan info
        document.getElementById("pokeImg").src = random.image;
        document.getElementById("pokeName").textContent = random.name;
        document.getElementById("pokeType").textContent = random.type;
        document.getElementById("pokeCate").textContent = random.category;
        document.getElementById("pokeEgg").textContent = random.eggGroup.join(", ");
        document.getElementById("pokeEvo").textContent = random.evoMethod;
        document.getElementById("pokeGen").textContent = `${random.generation}`;
        document.getElementById("pokeRegion").textContent = random.region;

        // 🆕 Tampilkan ulang papan dalam keadaan fresh
        displayCharacters(characters);
      }

      // Jalankan pertama kali
      generatePokemon();
    </script>
  </body>
</html>
